name: "Manual Hunt"
on:
  workflow_dispatch:
    inputs:
      bounty_url:
        description: 'Specific bounty URL to investigate (optional)'
        required: false
      platform:
        description: 'Platform to scan (immunefi, code4rena, sherlock, disclose, openbugbounty, huntbug, bountiesalert, all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - immunefi
          - code4rena
          - sherlock
          - disclose
          - openbugbounty
          - huntbug
          - bountiesalert

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  targeted_hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: "Targeted Hunt (Runner Engine)"
        run: python run_bounty_16_cycles.py
        env:
          PYTHONPATH: .
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPLITS_VAULT: "0xc87c3e8CB21e5A630Baf8D38b2060aCBb047afCb"
          TARGET_PLATFORM: ${{ github.event.inputs.platform }}
          TARGET_BOUNTY_URL: ${{ github.event.inputs.bounty_url }}

