name: "\ud83d\udd2b Manual Hunt"
on:
  workflow_dispatch:
    inputs:
      bounty_url:
        description: 'Specific bounty URL to investigate (optional)'
        required: false
      platform:
        description: 'Platform to scan (algora, github, immunefi)'
        required: true
        default: 'algora'
        type: choice
        options:
          - algora
          - github
          - immunefi
          - all

jobs:
  targeted_hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: "\ud83c\udfaf Targeted Hunt"
        run: python -m agents.b2_10_boss
        env:
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.FLEET_GITHUB_PAT || secrets.GITHUB_TOKEN }}
          SPLITS_VAULT: "0xc87c3e8CB21e5A630Baf8D38b2060aCBb047afCb"
          TARGET_PLATFORM: ${{ github.event.inputs.platform }}
          TARGET_BOUNTY_URL: ${{ github.event.inputs.bounty_url }}
