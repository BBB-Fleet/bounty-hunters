name: "\ud83c\udff4\u200d\u2620\ufe0f Bounty Pipeline"
on:
  schedule:
    - cron: '0 */3 * * *'   # Every 3 hours (8 hunts/day)
  workflow_dispatch:          # Manual trigger for testing
    inputs:
      target_platform:
        description: 'Target platform (all, algora, github, immunefi)'
        required: false
        default: 'all'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "Install Dependencies"
        run: pip install -r requirements.txt

      - name: "Run Bounty Pipeline"
        run: python -m agents.b2_10_boss
        env:
          PYTHONPATH: .
          NEON_CONNECTION_STRING: ${{ secrets.NEON_CONNECTION_STRING }}
          UPSTASH_REDIS_URL: ${{ secrets.UPSTASH_REDIS_URL }}
          UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.FLEET_GITHUB_PAT || secrets.GITHUB_TOKEN }}
          SPLITS_VAULT: "0xc87c3e8CB21e5A630Baf8D38b2060aCBb047afCb"
          TARGET_PLATFORM: ${{ github.event.inputs.target_platform || 'all' }}

      - name: "\ud83d\udcca Pipeline Summary"
        if: always()
        run: |
          echo "## \ud83c\udff4\u200d\u2620\ufe0f Bounty Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Platform**: ${{ github.event.inputs.target_platform || 'all' }}" >> $GITHUB_STEP_SUMMARY
